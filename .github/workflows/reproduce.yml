name: Reproduce Live Case 01

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install -y swi-prolog-nox

      - name: Install OPA 1.20.2
        run: |
          curl -L -o /tmp/opa https://openpolicyagent.org/downloads/v1.20.2/opa_linux_amd64_static
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          opa version

      - name: Reproduce both paths
        run: |
          chmod +x ./run-demo.sh
          ./run-demo.sh
